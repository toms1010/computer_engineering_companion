name: computer_engineering_companion
description: A complete offline learning platform for Computer Engineering students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  sqflite: ^2.3.0
  path: ^1.8.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    # Prebuilt first-run database. Copying this is orders of magnitude faster
    # than inserting 3 758 rows at launch. Regenerated by
    # `test/seed_database_test.dart`.
    - assets/seed/
